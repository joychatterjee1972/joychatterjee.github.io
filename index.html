<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Joy Chatterjee – Portrait Artist | Coming soon</title>
<meta name="description" content="The new website of Joy Chatterjee, hyper-realist portrait artist in Kolkata, is coming soon.">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz@0,6..96;1,6..96&family=Karla:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F1F1EE;--ink:#27303A;--muted:#5E6873;--accent:#8A5F14}
@media (prefers-color-scheme: dark){:root{--paper:#1B2128;--ink:#E9E7E2;--muted:#A3AAB2;--accent:#D6A650}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:400 1.0625rem/1.6 "Karla",system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;text-align:center;
  padding:max(32px,env(safe-area-inset-top)) 24px max(32px,env(safe-area-inset-bottom))}
main{max-width:640px}
h1{font-family:"Bodoni Moda",Georgia,serif;font-weight:400;font-size:clamp(2.4rem,9vw,4.8rem);line-height:1.05;margin:0 0 12px}
.role{color:var(--muted);font-size:clamp(1rem,2.5vw,1.2rem);margin:0 0 40px}
.soon{font-family:"Bodoni Moda",Georgia,serif;font-style:italic;color:var(--accent);font-size:clamp(1.4rem,4.5vw,2rem);margin:0 0 12px}
.note{margin:0 auto 36px;max-width:40ch}
.links{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 28px;font-weight:700}
a{color:inherit;text-decoration-color:var(--accent);text-underline-offset:4px}
a:hover{color:var(--accent)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<main>
  <h1>Joy Chatterjee</h1>
  <p class="role">Hyper-realist portrait artist, Kolkata</p>
  <p class="soon">Website coming soon.</p>
  <p class="note">Portrait commissions are open. Get in touch to begin.</p>
  <div class="links">
    <a href="https://wa.me/91XXXXXXXXXX" target="_blank" rel="noopener">WhatsApp</a>
    <a href="mailto:joychatterjee.art@gmail.com">joychatterjee.art@gmail.com</a>
    <a href="https://instagram.com/joychatterjee.art" target="_blank" rel="noopener">Instagram</a>
  </div>
</main>
</body>
</html>
